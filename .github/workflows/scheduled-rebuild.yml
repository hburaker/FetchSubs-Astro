# Rebuilds and redeploys the site every day so blog posts with a future publishDate go live on their date.
# Setup: add two repository secrets (GitHub > Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID (shown in the dashboard URL and on Workers & Pages)
name: Scheduled rebuild
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
